services:
  elasticmq:
    image: softwaremill/elasticmq
    container_name: elasticmq
    volumes:
        - ./custom.conf:/opt/elasticmq.conf
    command: -Dconfig.file=/opt/elasticmq.conf
    ports:
        - "9324:9324"
        - "9325:9325"
    networks:
      - backend
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
        - "8080:80"
    depends_on:
        - elasticmq
        - auth_service
        - chat_service
        - user_service
    networks:
        - backend
  cognito_mockup:
    build:
      context: ../aws-mockup
      dockerfile: Dockerfile
    environment:
      PORT: 4444
    ports:
      - "4444:4444"
    restart: always
    networks:
      - backend
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    environment:
      RUNTIME_ENV: docker
      PORT: 4000
      PHX_HOST: "auth_service"
      COGNITO_HOST: cognito_mockup
      SQS_HOST: elasticmq
    ports:
      - "4000:4000"
    restart: always
    networks:
        - backend
  user_service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    environment:
      RUNTIME_ENV: docker
      DATABASE_URL: "ecto://postgres:postgres@db:5432/user_service"
      PORT: 4001
      PHX_HOST: "user_service"
      COGNITO_HOST: cognito_mockup
      SQS_HOST: elasticmq
    ports:
      - "4001:4001"
    depends_on:
      - db
    restart: always
    networks:
        - backend
  chat_service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    environment:
      RUNTIME_ENV: docker
      DATABASE_URL: "ecto://postgres:postgres@db:5432/chat_service"
      PORT: 4002
      PHX_HOST: "chat_service"
      COGNITO_HOST: cognito_mockup
    ports:
      - "4002:4002"
    depends_on:
      - db
    restart: always
    networks:
      - backend
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    networks:
      - backend
networks:
    backend:
        driver: bridge
volumes:
  pg_data: